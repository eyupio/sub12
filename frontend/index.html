<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept as a single tag: store/theme.ts rewrites its content when the
         user switches theme, and querySelector would only ever see the first. -->
    <meta name="theme-color" content="#0C0C0C" />
    <meta name="color-scheme" content="dark light" />

    <!-- Home-screen install on iOS: run without Safari chrome and let the
         status bar sit over the app's own background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUB12" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary SEO -->
    <title>SUB12 — Score Cards, Pellet Testing, Leagues &amp; Events for FT / HFT</title>
    <meta name="description" content="Track scores, manage gear, run live events, and compete in leagues. Built for precision airgun shooters — Field Target (FT), Hunter Field Target (HFT), and benchrest." />
    <meta name="keywords" content="airgun, sub-12, score tracker, precision shooting, shooting leagues, pellet rifle, field target, FT, HFT, hunter field target, events, benchrest" />
    <meta name="author" content="SUB12" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SUB12" />
    <meta property="og:title" content="SUB12 — Score Cards, Pellet Testing, Leagues &amp; Events for FT / HFT" />
    <meta property="og:description" content="Track scores, manage gear, run live events, and compete in leagues. Built for precision airgun shooters — FT, HFT, and benchrest." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SUB12 — Precision Shooting Platform" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SUB12 — Score Cards, Pellet Testing, Leagues &amp; Events for FT / HFT" />
    <meta name="twitter:description" content="Track scores, manage gear, run live events, and compete in leagues. Built for precision airgun shooters — FT, HFT, and benchrest." />
    <meta name="twitter:image" content="/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SUB12",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web, iOS, Android",
      "url": "https://sub12.io",
      "description": "Track scores, manage gear, run live events, and compete in leagues. Built for precision airgun shooters — Field Target (FT), Hunter Field Target (HFT), and benchrest.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
      "featureList": [
        "25-shot Score Cards for FT and HFT",
        "Image-based Pellet Testing with MOA calculation",
        "Leagues with seasons, rounds, and audit trail",
        "Shooting Clubs and standings",
        "Live Events with real-time scoreboard",
        "Deep Statistics and score trends",
        "Achievements and social feed",
        "Gear management for rifles and pellets"
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://sub12.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
