<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0C" />

    <title>SUB12</title>
    <meta name="description" content="SUB12 — Precision Shooting Platform" />
    <!-- Holding page served only while the frontend container is unreachable,
         and only when nothing is in front of the backend to intercept the 503
         it ships with — behind our own nginx the visitor gets the real shell
         instead (see the @spa_shell block in frontend/nginx.conf). Tell
         crawlers not to index the placeholder so a cold start can't poison
         search results with "Getting things ready" titles.

         Nothing here may depend on JavaScript. Our Content-Security-Policy is
         `script-src 'self'`, which blocks inline scripts and inline event
         handlers alike — an earlier version of this page promised to refresh
         itself from an inline script that the browser silently refused to run,
         which is how a "temporary" holding page became somewhere people got
         stuck. -->
    <meta name="robots" content="noindex" />

    <meta property="og:site_name" content="SUB12" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SUB12" />
    <meta property="og:description" content="SUB12 — Precision Shooting Platform" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SUB12" />
    <meta name="twitter:description" content="SUB12 — Precision Shooting Platform" />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; padding: 0; background: #0C0C0C; color: #E7E4DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .card { max-width: 420px; padding: 32px; text-align: center; }
      .brand { letter-spacing: 0.25em; font-size: 13px; color: #C9A86A; text-transform: uppercase; margin-bottom: 12px; }
      h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; color: #E7E4DE; }
      p { font-size: 14px; color: #9A948A; margin: 0 0 20px; line-height: 1.5; }
      a { display: inline-block; padding: 10px 18px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #0C0C0C; background: #C9A86A; text-decoration: none; border-radius: 4px; }
      a:hover { opacity: 0.85; }
      .dot { display: inline-block; width: 6px; height: 6px; background: #C9A86A; border-radius: 50%; margin: 0 3px; animation: pulse 1.4s infinite ease-in-out; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">SUB12</div>
        <h1>Getting things ready<span class="dot"></span><span class="dot"></span><span class="dot"></span></h1>
        <p>sub-12 is still starting up. Give it a moment, then try again.</p>
        <a href="/">Go to sub-12</a>
      </div>
    </div>
  </body>
</html>
