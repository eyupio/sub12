<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>SUB12</title>
  <desc>SUB12 crosshair reticle icon mark</desc>
  <!-- Outer pulse ring -->
  <circle cx="40" cy="40" r="35" stroke="#D4A44A" stroke-width="0.3"/>
  <!-- Main circle -->
  <circle cx="40" cy="40" r="26" stroke="#D4A44A" stroke-width="1.2"/>
  <!-- Centre dot -->
  <circle cx="40" cy="40" r="2" fill="#D4A44A"/>
  <!-- Crosshair lines — cross circle boundary, leave gap before centre -->
  <line x1="40" y1="6"  x2="40" y2="22" stroke="#D4A44A" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="40" y1="58" x2="40" y2="74" stroke="#D4A44A" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="6"  y1="40" x2="22" y2="40" stroke="#D4A44A" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="74" y2="40" stroke="#D4A44A" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Inner tick marks -->
  <line x1="40" y1="25" x2="40" y2="28" stroke="#D4A44A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="52" x2="40" y2="55" stroke="#D4A44A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="25" y1="40" x2="28" y2="40" stroke="#D4A44A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="52" y1="40" x2="55" y2="40" stroke="#D4A44A" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
</svg>
