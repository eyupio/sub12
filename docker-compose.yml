services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sub12}
      POSTGRES_USER: ${DB_USER:-sub12}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sub12}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # IMAGE_REPO lets a fork run its own images without editing this file:
    # release.yml publishes to ghcr.io/<your-org>/sub-12-{backend,frontend}, so
    # set IMAGE_REPO=ghcr.io/your-org in .env and both services follow.
    # IMAGE_TAG pins a specific build (`sha-<commit>`) instead of `latest`.
    image: ${IMAGE_REPO:-ghcr.io/eyupio}/sub-12-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/backups:/var/lib/sub12/backups
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      SEED_ADMIN: ${SEED_ADMIN:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Lets the share-meta handler fetch the SPA index.html from the
      # frontend container so per-page Open Graph tags can be injected for
      # shared links. Set here as well as defaulted in code: if the backend
      # cannot reach it, every shared link and every fixed public page serves
      # a holding page marked noindex, and nothing anywhere reports an error.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:8080}
      # SITE_URL is the single source of truth for every link sent by email or
      # push: applyDerivedDefaults() in internal/config builds PASSWORD_RESET_URL,
      # EVENT_INVITATION_URL and DEFAULT_AVATAR_URL from it whenever they are
      # unset. So set this one and the rest follow.
      #
      # These deliberately have no sub12.io fallback. They used to, and it meant
      # a self-hoster who set SITE_URL to their own domain still emailed their
      # members password-reset links pointing at sub12.io — an account recovery
      # flow that silently sent people to somebody else's site. Pass them
      # explicitly only if you genuinely serve those pages from another host.
      SITE_URL: ${SITE_URL:?SITE_URL is required — the public URL people reach sub12 at}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      EVENT_INVITATION_URL: ${EVENT_INVITATION_URL:-}
      # Reverse geocoding for picked locations. Empty disables the lookup and
      # the app falls back to showing coordinates.
      GEOCODE_URL: ${GEOCODE_URL:-https://nominatim.openstreetmap.org}
      # Postgres sits on this compose network with no published port, and
      # postgres:16-alpine serves no certificate unless one is mounted, so the
      # connection is unencrypted and nothing off-host can observe it. In
      # production the backend refuses an unencrypted database connection unless
      # the operator says that deliberately — this is that statement, scoped to
      # the topology this file defines. Pointing DB_HOST at a managed database
      # somewhere else means setting DB_SSLMODE=require and removing this line.
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_ALLOW_INSECURE_LOCAL_NETWORK: ${DB_ALLOW_INSECURE_LOCAL_NETWORK:-true}
    # No host port — the frontend nginx proxies /api/ to this container
    # internally. Expose 8080 here only if you need direct curl access.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/eyupio}/sub-12-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Put a TLS-terminating reverse proxy in front of this port. The container
      # serves the SPA and proxies /api/ to the backend internally, so it is the
      # only upstream a proxy needs.
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
