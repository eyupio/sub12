services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sub12}
      POSTGRES_USER: ${DB_USER:-sub12}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sub12}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/jnnngs/sub-12-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/backups:/var/lib/sub12/backups
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      SEED_ADMIN: ${SEED_ADMIN:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Lets the share-meta handler fetch the SPA index.html from the
      # frontend container at startup so per-page Open Graph tags can be
      # injected for shared links.
      FRONTEND_ORIGIN: http://frontend:8080
    # No host port — the frontend nginx proxies /api/ to this container
    # internally. Expose 8080 here only if you need direct curl access.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/jnnngs/sub-12-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
