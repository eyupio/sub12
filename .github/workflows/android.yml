name: Android APK

# Builds the Capacitor Android app and publishes the APK as a downloadable
# asset.
#
#   pull_request  → debug APK, uploaded as a workflow artifact only
#   push to main  → release APK attached to the rolling `android-latest`
#                   pre-release, so there is always one stable download URL:
#                   https://github.com/<owner>/<repo>/releases/download/android-latest/sub12.apk
#   tag v*        → release APK attached to that version's GitHub Release
#   manual run    → release APK as an artifact
#
# Signing uses the ANDROID_KEYSTORE_* secrets when they are configured. Without
# them the job falls back to a CI key it mints once and then reuses from the
# Actions cache. Android identifies an installed app by (package name, signing
# certificate), so a key that changes between builds makes every new APK refuse
# to install over the previous one — the phone silently keeps running the build
# it already has. The fallback key keeps the sideload channel upgradeable; it is
# still testing-only, because a cache eviction rotates it.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is needed by one thing only: refreshing the rolling
# `android-latest` pre-release and attaching APKs to tagged releases. The build
# itself needs nothing beyond read.
#
# It is safe on the pull_request trigger because GitHub issues a read-only token
# to workflows running for a pull request from a fork, whatever this block says —
# so an outside contributor's PR cannot publish a release even though the same
# workflow can. Don't rely on that alone if this ever grows a second job: scope
# the write to the publishing job instead.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: blacksmith-8vcpu-ubuntu-2404

    env:
      # Monotonic across runs so Android accepts each build as an upgrade.
      ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve build variant and version name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=frontend/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=frontend/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          fi

          # Tags carry their own version; every other build is stamped with the
          # run number and short SHA so an installed APK is traceable to a commit.
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.${{ github.run_number }}-${GITHUB_SHA::7}"
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Ensure debug keystore
        if: steps.vars.outputs.variant == 'debug'
        run: |
          set -euo pipefail
          keystore="$HOME/.android/debug.keystore"
          # app/build.gradle declares an explicit debug signingConfig, which
          # stops AGP auto-creating the default debug keystore. A fresh runner
          # therefore has no such file and validateSigningDebug fails. Mint one
          # with the standard debug credentials build.gradle expects.
          if [ ! -f "$keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # The fallback signing key has to survive between runs. Android keys an
      # installed package on its signing certificate, so minting a new one each
      # build makes `android-latest` un-installable for anyone who already has
      # the app: the installer rejects it with INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # and they carry on running whichever build they installed first — new
      # commits land in the APK but never reach the device. Restoring the same
      # key from the cache keeps sideloaded builds upgrading in place. Unused
      # when the ANDROID_KEYSTORE_* secrets are configured.
      - name: Restore the fallback CI signing key
        if: steps.vars.outputs.variant == 'release'
        uses: actions/cache@v6
        with:
          path: ~/.sub12-ci-signing
          key: android-fallback-keystore-v1

      - name: Configure release signing
        id: signing
        if: steps.vars.outputs.variant == 'release'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the configured release keystore."
            # Inside the repo so the cleanup step below wipes it from the runner.
            keystore="$(pwd)/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          else
            # Outside the repo, so it lands in the cached directory rather than
            # being deleted with the rest of the signing material.
            keystore="$HOME/.sub12-ci-signing/release.keystore"
            store_password="sub12ci"
            key_alias="sub12ci"
            key_password="sub12ci"
            if [ -f "$keystore" ]; then
              echo "::notice::No ANDROID_KEYSTORE_BASE64 secret set — reusing the cached CI key. This APK upgrades a previous CI build in place."
            else
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set and no cached CI key — minting one. Anyone already running a CI build has to uninstall SUB12 before this APK will install."
              mkdir -p "$(dirname "$keystore")"
              keytool -genkeypair -v \
                -keystore "$keystore" \
                -alias "$key_alias" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$store_password" -keypass "$key_password" \
                -dname "CN=SUB12 CI, OU=CI, O=SUB12, C=GB"
            fi
          fi
          # build.gradle reads this file from the android/ project root and falls
          # back to the debug keystore when it's absent.
          cat > keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$store_password
          keyAlias=$key_alias
          keyPassword=$key_password
          EOF
          # Publish the certificate alongside the APK. A signature change is
          # invisible from the download page but is the one thing that stops an
          # install, so it needs to be checkable rather than guessed at.
          fingerprint="$(keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" 2>/dev/null \
            | sed -n 's/.*SHA-256: //p' | head -1)"
          echo "signer_sha256=${fingerprint:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ steps.vars.outputs.variant }} APK
        working-directory: frontend/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.vars.outputs.gradle_task }} --no-daemon --stacktrace

      - name: Stage APK for upload
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          name="sub12-${{ steps.vars.outputs.version_name }}-${{ steps.vars.outputs.variant }}.apk"
          cp "${{ steps.vars.outputs.apk_path }}" "dist-apk/$name"
          # A fixed filename alongside the versioned one keeps the rolling
          # download URL stable across releases.
          cp "${{ steps.vars.outputs.apk_path }}" "dist-apk/sub12.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk

      - name: Remove signing material
        if: always()
        run: rm -f frontend/android/keystore.properties frontend/android/release.keystore

      - name: Upload APK artifact
        # The build itself is the check; losing the artifact (e.g. to the
        # org's artifact storage quota) must not fail an otherwise-green job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sub12-apk-${{ steps.vars.outputs.variant }}
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── Publish ───────────────────────────────────────────────────────────
      # main pushes refresh a single rolling pre-release so the "download the
      # Android app" link never has to change.
      - name: Publish rolling android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Android APK (latest main)
          body: |
            Automatically built from `main` — commit ${{ github.sha }}.

            **Download:** `sub12.apk` below, or the versioned
            `${{ steps.stage.outputs.name }}`.

            Android blocks installs from outside the Play Store by default;
            allow installs from your browser or file manager when prompted.

            If the install fails with "app not installed" or "package conflicts
            with an existing package", this build is signed with a different key
            than the one on the device — uninstall SUB12 and install again.
            Signing certificate (SHA-256): `${{ steps.signing.outputs.signer_sha256 }}`
          prerelease: true
          make_latest: false
          files: dist-apk/*.apk

      # Version tags attach the APK to that tag's own release.
      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-apk/*.apk
