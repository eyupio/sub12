name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing in the PR gate writes to the repository. Declaring this explicitly
# means the workflow's token stays read-only regardless of the org-wide default,
# so a compromised dependency in a build step cannot push a commit or a package.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sub12_test
          POSTGRES_USER: sub12
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sub12_test
      DB_USER: sub12
      DB_PASSWORD: testpassword
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_EXPIRY_HOURS: 24
      PORT: 8080
      ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint migrations (no duplicate prefixes)
        run: |
          dupes=$(ls internal/db/migrations/*.sql \
            | sed 's/.*\///' \
            | cut -d_ -f1 \
            | sort | uniq -c | awk '$1 > 2 {print $2}')
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration prefixes: $dupes"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload backend coverage
        if: always()
        # Coverage reports are a convenience, not a gate — losing one (e.g. to
        # the org's artifact storage quota) must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

      - name: Build
        run: go build -o bin/api ./cmd/api

      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (React)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        # Coverage reports are a convenience, not a gate — losing one (e.g. to
        # the org's artifact storage quota) must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker image smoke tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: sub12-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: sub12-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
