name: Security

# Standing security scans. Deliberately separate from ci.yml: these are the
# checks whose answer changes when nothing in the repository changes — a CVE
# published against a dependency we already shipped — so they run on a schedule
# as well as on pull requests.
#
# ci.yml already runs govulncheck and `npm audit` as advisory steps on every PR.
# This workflow is the version that *fails*, so a new advisory gets a red tick
# somebody has to look at rather than a line buried in a passing log.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC, an hour after Dependabot opens its pull requests, so the
    # scan reflects whatever it did or could not fix.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Every job narrows this further. Nothing here needs write access to the
# repository except CodeQL's SARIF upload, which asks for security-events.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- CodeQL
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning is free on public repositories and requires GitHub Advanced
    # Security on private ones. sub12 is being opened up, so until the switch is
    # flipped this job cannot upload its results: the analysis itself succeeds
    # and then the SARIF upload fails with "Advanced Security must be enabled
    # for this repository to use code scanning".
    #
    # Skipping is the honest outcome. `continue-on-error` would leave a job that
    # always reports success and never uploads anything, which is worse than not
    # having it — nobody would notice when it silently stopped working. A skipped
    # job is visible in the checks list and starts working, with nothing to
    # change here, the moment the repository goes public.
    #
    # `== false` rather than `!private` deliberately: an event payload without a
    # repository object then skips rather than running and failing.
    if: github.event.repository.private == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      # Go needs a toolchain before autobuild, and it has to be the one go.mod
      # pins — CodeQL analysing a build that never happened finds nothing and
      # still reports success.
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the rules that are accurate but noisier than
          # the default pack. Worth it on a codebase handling auth and uploads.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ----------------------------------------------------------------- Go modules
  govulncheck:
    name: Go vulnerabilities
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # govulncheck reports only vulnerabilities actually reachable from our
      # code, so unlike a plain dependency diff a finding here means something.
      # A stdlib finding is fixed by raising the `go` directive in backend/go.mod
      # to the patch release named in the report — that directive is what CI
      # resolves the toolchain from.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ---------------------------------------------------------------- npm projects
  npm-audit:
    name: npm audit (${{ matrix.project }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # --omit=dev first: a vulnerability in something that ships to a user's
      # browser is a different kind of problem from one in a build tool, and
      # should never be lost in the same list. This half must stay clean.
      - name: Runtime dependencies (must be clean)
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=moderate

      # Build and test tooling. Advisory: the known exceptions are documented in
      # SECURITY.md ("Known accepted risks") along with why they are not yet
      # fixed, and a red tick here every Monday would train everyone to ignore
      # this workflow. Read the log when it is yellow.
      - name: All dependencies (advisory)
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npm audit --audit-level=high

  # -------------------------------------------------- new dependencies in a PR
  dependency-review:
    name: Dependency review
    # Same gate as CodeQL, same reason: the action reports "Dependency review is
    # not supported on this repository" without Dependency graph + Advanced
    # Security, which a private repo does not have. Free once public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: dependency-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=false
          while IFS= read -r file; do
            case "$file" in
              go.mod|go.sum|package.json|package-lock.json|*/go.mod|*/go.sum|*/package.json|*/package-lock.json)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - if: steps.dependency-changes.outputs.changed == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # sub12 is AGPL-3.0, so a permissively licensed dependency is fine and
          # a copyleft-incompatible one is not. These three cannot be combined
          # with AGPL-3.0 distribution.
          deny-licenses: MS-RL, SSPL-1.0, BUSL-1.1

  # ------------------------------------------------------------ secrets in git
  secret-scan:
    name: Secret scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the commits a PR adds, not just the
          # tree. A secret committed and then removed in the same PR is still a
          # secret that was pushed to GitHub, and still needs rotating.
          fetch-depth: 0

      # The gitleaks *tool* is MIT-licensed and free. `gitleaks-action`, the
      # wrapper, requires a paid GITLEAKS_LICENSE for organisation-owned repos and
      # fails hard without one ("[eyupio] is an organization. License key is
      # required"). So install the CLI and skip the wrapper: same scanner, no
      # licence gate.
      #
      # Installed as a binary rather than run from the Docker image because the
      # containerised route needs both a writable mount and a safe.directory
      # override — git inside the container runs as root against a checkout owned
      # by the runner user and refuses it as dubious ownership. A pinned tarball
      # verified against the release checksum is simpler and has a smaller trust
      # surface than a floating image tag.
      #
      # Pinned by version AND sha256: without the checksum, "pinned" only means
      # the tag hasn't moved, and a release asset can be replaced.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans the whole history, not just the tree: a secret committed and later
      # removed is still a secret that was pushed.
      #
      # --redact matters. Without it a genuine finding is printed into an Actions
      # log, which on a public repository is a second disclosure on top of the
      # first.
      #
      # Confirmed false positives, and the reasoning for each, live in
      # .gitleaks.toml. This is the same command `make security` runs, so a CI
      # finding reproduces locally verbatim.
      - name: gitleaks
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .

  # ------------------------------------------- placeholder secrets must be refused
  # The guard that stops a self-hoster booting production with the published
  # example credentials is only worth having if it is known to work. This asserts
  # that the .env.example we ship is refused in production and accepted in
  # development — see internal/config.Validate and SECURITY.md.
  config-guard:
    name: Placeholder credentials are refused
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: config.Validate rejects every published placeholder
        working-directory: backend
        run: go test -run 'TestValidate|TestPlaceholder|TestIsPlaceholder' -v ./internal/config/
